name: Get Elm
description: Downloads and installs Elm. Also caches Elm packages.

inputs:
  elm-version:
    default: "0.19.3"
    type: string
  cache-deps:
    default: true
    type: boolean

runs:
  using: composite
  steps:
    - name: cache-elm
      id: cache-elm
      uses: actions/cache@v4
      with:
        path: /usr/local/bin/elm
        key: linux-elm-${{ inputs.elm-version }}
    - name: cache-elm-deps
      id: cache-elm-deps
      if: ${{ inputs.cache-deps != false }}
      uses: actions/cache@v4
      with:
        path: ~/.elm
        key: elm-cache

    - name: download-elm
      shell: bash
      if: steps.cache-elm.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/elm/compiler/releases/download/${{ inputs.elm-version }}/elm-${{ inputs.elm-version }}-linux-x64.gz
        pigz -dc elm-${{ inputs.elm-version }}-linux-x64.gz > /usr/local/bin/elm
        chmod +x /usr/local/bin/elm