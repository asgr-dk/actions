name: Elm Publish

on:
  workflow_call:
    inputs: {}

jobs:
  build:
    runs-on: ubuntu-slim
    if: github.ref_type == 'branch'
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: asgr-dk/actions/.github/actions/get-elm@1.1.0
      - shell: bash
        name: Build Package
        run: elm make --output=/dev/null

  publish:
    runs-on: ubuntu-slim
    if: github.ref_type == 'tag'
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: asgr-dk/actions/.github/actions/get-elm@1.1.0
      - shell: bash
        name: Match tag with elm.json
        run: |
          GIT_TAG="${{ github.ref_name }}"
          ELM_VERSION=$(jq -r '.version' elm.json)
          if [ "$GIT_TAG" != "$ELM_VERSION" ]; then
            echo "::error::Mismatch: tag=$GIT_TAG, elm.json=$ELM_VERSION"
            exit 1
          fi
      - shell: bash
        name: Publish Package
        run: elm publish