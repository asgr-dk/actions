name: Github Pages

on:
  workflow_call:
    inputs:

      name:
        description: Name of the deployment environment
        type: string
        default: github-pages

      script:
        description: |
          Bash script that builds the site.
          The directory `_site` is already created — put all files for the site there.
        type: string
        default: echo "<h1>hello world!</h1>" > _site/index.html
      
      get-elm:
        default: false
        type: boolean

      get-esbuild:
        default: false
        type: boolean
jobs:
  build:
    runs-on: ubuntu-slim
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: asgr-dk/actions/.github/actions/get-elm@0.6.0
        if: inputs.get-elm == true
      - uses: asgr-dk/actions/.github/actions/get-esbuild@0.6.0
        if: inputs.get-esbuild == true
      - shell: bash
        name: Run build script
        run: |
          set -euo pipefail
          mkdir -p _site
          ${{ inputs.script }}
          if [ -z "$(ls -A _site)" ]; then
            echo "::error::Build script finished but _site is empty"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: site
          path: _site
          retention-days: 1

  deploy:
    runs-on: ubuntu-slim
    needs: build
    if: github.ref_type == 'tag'
    environment:
      name: ${{ inputs.name }}
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy