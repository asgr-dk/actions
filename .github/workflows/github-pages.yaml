name: Github Pages

on:
  workflow_call:
    inputs:
      build-action:
        description: |
          A composite action that builds the site.
          It must produce a `_site` directory.
        type: string
        required: true
      env-name:
        description: The name of the deployment environment
        type: string
        default: github-pages
jobs:
  build:
    runs-on: ubuntu-slim
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: ${{ inputs.build-action }}
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: site
          path: _site
          retention-days: 1
  deploy:
    runs-on: ubuntu-slim
    needs: build
    if: github.ref_type == 'tag'
    environment:
      name: ${{ inputs.env-name }}
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy